<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Reading Sheet — Dev Harness</title>
  <link rel="stylesheet" href="css/appshell.css" />
  <link rel="stylesheet" href="css/create_reading.css" />
</head>
<body>

  <!-- Dev harness: open/close + theme toggle for testing -->
  <div class="dev-harness">
    <div class="dev-harness__controls">
      <span class="dev-harness__label">Dev controls</span>
      <button class="dev-btn" id="openModalBtn">Open Modal</button>
      <button class="dev-btn" id="toggleThemeBtn">Toggle Theme</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       CREATE READING SHEET — MODAL
  ══════════════════════════════════════════ -->
  <div class="cr-backdrop" id="crBackdrop" hidden aria-hidden="true">
    <div class="cr-modal" role="dialog" aria-modal="true" aria-labelledby="crModalTitle">

      <!-- Header -->
      <div class="cr-header">

        <!-- Template dropdown -->
        <div class="cr-header__template-wrap">
          <div class="cr-select-wrap">
            <select id="crTemplateSelect" class="cr-select">
              <option value="">Select Template...</option>
              <option value="tpl_monthly">Monthly Standard</option>
              <option value="tpl_quarterly">Quarterly Round</option>
              <option value="tpl_special">Special Reading</option>
            </select>
            <!-- Chevron -->
            <svg class="cr-select__chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- Templates button -->
        <div class="cr-header__templates-wrap">
          <button class="cr-header__templates-btn" type="button" id="crTemplatesMenuBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            Templates
          </button>
          <ul class="cr-templates-dropdown" id="crTemplatesDropdown" hidden>
            <li class="cr-templates-dropdown__item" data-tpl="tpl_monthly">
              <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              Monthly Standard
            </li>
            <li class="cr-templates-dropdown__item" data-tpl="tpl_quarterly">
              <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              Quarterly Round
            </li>
            <li class="cr-templates-dropdown__item" data-tpl="tpl_special">
              <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              Special Reading
            </li>
          </ul>
        </div>

        <!-- Close -->
        <button class="cr-header__close" type="button" id="crCloseBtn" aria-label="Close modal">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
          </svg>
        </button>

      </div>
      <!-- /cr-header -->

      <!-- Body — Phase 2: date fields -->
      <div class="cr-body">
        <div class="cr-form">

          <!-- Row 1: Billing Date | Due Date -->
          <div class="cr-row cr-row--2col">

            <div class="cr-field">
              <label class="cr-field__label" for="crBillingDate">Billing Date</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="date" id="crBillingDate"
                       value="2025-07-01" />
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

            <div class="cr-field">
              <label class="cr-field__label" for="crDueDate">Due Date</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="date" id="crDueDate"
                       value="2025-07-15" />
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

          </div>

          <!-- Row 2: Disconnection Date (full width) -->
          <div class="cr-row cr-row--1col">

            <div class="cr-field">
              <label class="cr-field__label" for="crDisconnectionDate">Disconnection Date</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="date" id="crDisconnectionDate"
                       value="2025-08-01" />
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

          </div>

          <!-- Row 3: Billing Period Start + Override checkbox -->
          <div class="cr-row cr-row--2col cr-row--valign">

            <div class="cr-field">
              <label class="cr-field__label" for="crBillingPeriodStart">Billing Period Start</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="date" id="crBillingPeriodStart"
                       value="2025-07-01" disabled />
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

            <div class="cr-field cr-field--checkbox-only">
              <label class="cr-checkbox-label" for="crOverrideStart">
                <input class="cr-checkbox" type="checkbox" id="crOverrideStart" />
                <span class="cr-checkbox__box" aria-hidden="true"></span>
                Override Start Date
              </label>
            </div>

          </div>

          <!-- Row 4: Meter Reader searchable dropdown -->
          <div class="cr-row cr-row--1col">

            <div class="cr-field">
              <label class="cr-field__label" for="crMeterReaderInput">Meter Reader</label>
              <div class="cr-combobox" id="crMeterReaderCombobox">
                <div class="cr-input-wrap">
                  <input
                    class="cr-input cr-input--search"
                    type="text"
                    id="crMeterReaderInput"
                    placeholder="Search meter reader..."
                    autocomplete="off"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="crMeterReaderList"
                    aria-autocomplete="list"
                  />
                  <!-- Search icon -->
                  <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M11 11l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                </div>
                <!-- Dropdown list -->
                <ul
                  class="cr-combobox__list"
                  id="crMeterReaderList"
                  role="listbox"
                  aria-label="Meter readers"
                  hidden
                ></ul>
              </div>
            </div>

          </div>

          <!-- Row 5: Zone | Book -->
          <div class="cr-row cr-row--2col">

            <div class="cr-field">
              <label class="cr-field__label" for="crZone">Zone</label>
              <div class="cr-input-wrap">
                <select class="cr-input cr-input--select" id="crZone">
                  <option value="">Select Zone...</option>
                  <option value="zone1">Zone 1</option>
                  <option value="zone2">Zone 2</option>
                  <option value="zone3">Zone 3</option>
                  <option value="zone4">Zone 4</option>
                </select>
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>

            <div class="cr-field">
              <label class="cr-field__label" for="crBook">Book</label>
              <div class="cr-input-wrap">
                <select class="cr-input cr-input--select" id="crBook">
                  <option value="">Select Book...</option>
                </select>
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>

          </div>

          <!-- Row 6: Scope (full width) -->
          <div class="cr-row cr-row--1col">

            <div class="cr-field">
              <label class="cr-field__label" for="crScope">Scope</label>
              <div class="cr-input-wrap">
                <select class="cr-input cr-input--select" id="crScope">
                  <option value="all">All</option>
                  <option value="unbilled">Unbilled</option>
                  <option value="ranged">Ranged</option>
                </select>
                <svg class="cr-input__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>

          </div>

          <!-- Row 7: Sequence range (shown only when Scope = Ranged) -->
          <div class="cr-row cr-row--2col cr-scope-range" id="crScopeRange" hidden>

            <div class="cr-field">
              <label class="cr-field__label" for="crFromSeq">From Sequence</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="number" id="crFromSeq"
                       min="0" placeholder="e.g. 0" />
              </div>
            </div>

            <div class="cr-field">
              <label class="cr-field__label" for="crToSeq">To Sequence</label>
              <div class="cr-input-wrap">
                <input class="cr-input" type="number" id="crToSeq"
                       min="1" placeholder="e.g. 100" />
              </div>
            </div>

          </div>

        </div>
      </div>
      <!-- /cr-body -->

      <!-- Accounts table panel (populated by Load Accounts) -->
      <div class="cr-table-panel" id="crTablePanel" hidden>
        <div class="cr-table-wrap">
          <table class="cr-table" id="crAccountsTable" aria-label="Accounts">
            <thead>
              <tr>
                <th class="cr-th cr-th--num" scope="col">#</th>
                <th class="cr-th" scope="col">Account No.</th>
                <th class="cr-th" scope="col">Address</th>
                <th class="cr-th" scope="col">Account Type</th>
                <th class="cr-th cr-th--seq" scope="col">Sequence</th>
              </tr>
            </thead>
            <tbody id="crAccountsTbody">
              <!-- Rows injected by JS -->
            </tbody>
          </table>
        </div>
        <p class="cr-table-empty" id="crTableEmpty" hidden>
          No accounts match the selected filters.
        </p>

        <!-- Pagination -->
        <div class="cr-pagination" id="crPagination" hidden>
          <span class="cr-pagination__summary" id="crPagSummary"></span>
          <div class="cr-pagination__controls" id="crPagControls">
            <button class="cr-pag-btn" type="button" id="crPrevBtn" disabled>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Prev
            </button>
            <!-- page number buttons injected by JS -->
            <button class="cr-pag-btn" type="button" id="crNextBtn">
              Next
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 12l4-4-4-4" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- /cr-table-panel -->

      <!-- Footer: action buttons -->
      <div class="cr-footer">

        <!-- Left group: template-conditional buttons (hidden until a template is selected) -->
        <div class="cr-footer__left" id="crTemplateActions" hidden>
          <button class="cr-btn cr-btn--danger" type="button" id="crDeleteTemplateBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9"
                    stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Delete Template
          </button>
          <button class="cr-btn cr-btn--outline" type="button" id="crEditTemplateBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2L11.5 2.5z"
                    stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Edit Template
          </button>
        </div>

        <!-- Spacer -->
        <div class="cr-footer__spacer"></div>

        <!-- Right group: primary actions -->
        <div class="cr-footer__right">
          <button class="cr-btn cr-btn--outline" type="button" id="crLoadAccountsBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Load Accounts
          </button>
          <button class="cr-btn cr-btn--outline" type="button" id="crCreateTemplateBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            Create Template
          </button>
          <button class="cr-btn cr-btn--primary" type="button" id="crSaveBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2 8.5l4 4 8-8" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Save
          </button>
        </div>

      </div>
      <!-- /cr-footer -->

    </div>
  </div>
  <!-- /cr-backdrop -->

  <!-- Toast / snackbar -->
  <div class="cr-toast" id="crToast" hidden aria-live="polite"></div>

  <script src="js/create_reading.js"></script>
</body>
</html>
